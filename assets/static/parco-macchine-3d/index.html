<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="robots" content="noindex">
  <title>Il parco macchine nel tempo · Tedeschi</title>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/hlp3tzz.css" id="kit" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="dist/parco.css">
  <link rel="modulepreload" href="dist/parco.js">
</head>
<body>
<main class="exhibit" id="exhibit">
  <header class="mast">
    <div class="brand"><img src="media/tedeschi.png" alt="Tedeschi Edilizia e Ambiente"><span class="mast-rule"></span><h1>Parco macchine</h1></div>
    <button class="motion-switch" id="motion-switch" type="button" aria-pressed="false"><span class="switch-shape" aria-hidden="true"></span><span>Movimento ridotto</span></button>
  </header>
  <section class="scene" aria-label="L’evoluzione del parco macchine">
    <div class="backdrops" id="backdrops" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="story" id="story" aria-hidden="true">
      <span class="year">1960</span>
      <div class="story-copy"><span class="period"></span><h2 class="era-title"></h2><p></p></div>
    </div>
    <div id="view" class="view" tabindex="0" role="group" aria-label="Modello tridimensionale. Trascina orizzontalmente o usa le frecce sinistra e destra per ruotarlo.">
      <div class="loading" id="loading">Preparazione del modello 3D…</div>
    </div>
    <button id="recenter" class="inspect" type="button" aria-label="Ripristina l’inquadratura" title="Ripristina l’inquadratura"><span class="orbit-sign" aria-hidden="true">⟲</span> <span>Vista iniziale</span></button>
    <div class="sr" id="current-era" aria-live="polite"></div>
    <noscript>Per esplorare i modelli 3D abilita JavaScript.</noscript>
  </section>
  <nav class="timeline" aria-label="Cronologia del parco macchine">
    <div class="timeline-top">
      <div class="timeline-name"><span class="step-indicator" id="era-count">01 / 04</span><span>Seleziona un’epoca</span></div>
      <div class="transport">
        <button type="button" id="previous" aria-label="Epoca precedente" title="Epoca precedente">←</button>
        <button type="button" id="play" class="play" aria-label="Riproduci la transizione" title="Riproduci la transizione"><span aria-hidden="true" id="play-symbol">▶</span><span id="play-label">Riproduci</span></button>
        <button type="button" id="next" aria-label="Epoca successiva" title="Epoca successiva">→</button>
      </div>
    </div>
    <label class="scrub"><span class="sr">Avanzamento della scomposizione e del rimontaggio</span><input id="scrub" type="range" min="0" max="3" step="0.001" value="0"><span class="sr">Trascina per osservare i singoli passaggi.</span></label>
    <div class="stops" id="stops"></div>
    <p class="illustration-note">Ricostruzioni visive di modelli storici e contemporanei</p>
  </nav>
</main>
<script type="module" src="dist/parco.js"></script>
</body>
</html>
